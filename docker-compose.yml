# TubeTape 长期挂机（参数与 README「长期挂机（持续运行）」的 Docker 示例一致）
#
# 挂载（见下方 volumes）：
#   ./           -> /db    （读写）：数据库、日志、OAuth 凭据都放这里
#   ${MEDIA_DIR} -> /data  （只读）：照片/视频目录
#
# OAuth 凭据放哪里（因为 ./ 挂成了 /db）：
#   - client_secret.json：放到【本文件同目录】，容器内就是 /db/client_secret.json
#   - token.json：登录后自动生成到【本文件同目录】，容器内就是 /db/token.json
#
# 准备：
#   1. cp .env.example .env
#   2. 编辑 .env：填 MEDIA_DIR（宿主机照片目录绝对路径）；TUBETAPE_TOKEN 留空（改用 token.json）
#   3. 首次登录（必须交互式，不能用 up -d；client_secret.json 需已在【本文件同目录】）：
#        docker compose run --rm tubetape --db /db/tubetape.json \
#          --client-secret /db/client_secret.json --login
#      （--client-secret 的默认值就是 /db/client_secret.json，省略也行）
#   4. docker compose up -d
#
# 常用命令：
#   docker compose logs -f                                        # 实时终端日志
#   docker compose exec tubetape tail -f /db/tubetape.json.log    # 详细 DEBUG 日志（含 [cache]）
#   docker compose down                                           # 停止并删除容器（数据/日志/凭据保留在本目录）

services:
  tubetape:
    image: chet2026/tubetape
    container_name: tubetape
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 照片/视频目录：只读挂载进容器 /data
      - "${MEDIA_DIR:?请在 .env 中设置 MEDIA_DIR}:/data:ro"
      # 数据库 + 哈希缓存 + 日志 + OAuth 凭据(client_secret.json/token.json)：都落在
      # docker-compose.yml 同目录（容器内 /db）
      - ./:/db
    command:
      - --input
      - /data
      - --db
      - /db/tubetape.json
      # client_secret.json 放在 ./ （= /db）。此项只在 --login 时用到，
      # 平时运行忽略；写在这里是为了显式声明路径。
      - --client-secret
      - /db/client_secret.json
      - --timezone
      - Asia/Shanghai
      - --privacy
      - private
      - --max-resolution
      - 3840x2160
      - --segment-duration
      - "1200s"
      - --fps
      - "30"
      # 下面两行按需保留：只处理相机照片 + 手机视频，丢弃截图/网络传输副本
      #- --only-camera-photos
      #- --only-phone-videos
      - --watch
      - -v
